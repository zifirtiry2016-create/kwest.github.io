<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>360° Панорама</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080810;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overscroll-behavior: none;
    }

    #viewer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #11111b;
      touch-action: none;
      user-select: none;
    }

    #panorama {
      position: absolute;
      top: 50%;
      left: 50%;
      width: auto;
      max-width: none;
      user-select: none;
      pointer-events: none;
      -webkit-user-drag: none;
      will-change: transform;
      transform: translate3d(-50%, -50%, 0) scale(1.22);
      transform-origin: center center;
      height: 108vh;
    }

    .top-panel {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 10;
      pointer-events: none;
    }

    .label,
    .status {
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: rgba(10, 10, 20, 0.58);
      backdrop-filter: blur(10px);
      font-size: 13px;
      line-height: 1.2;
    }

    .status {
      color: #d9d9e7;
      text-align: right;
      max-width: 72%;
    }

    .error {
      color: #ffb9b9;
    }

    .start-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(6, 6, 14, 0.76);
      backdrop-filter: blur(12px);
    }

    .start-card {
      width: min(420px, 100%);
      padding: 28px 20px 22px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      background: linear-gradient(150deg, rgba(53, 38, 104, 0.98), rgba(18, 18, 37, 0.98));
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .start-card h1 {
      margin: 0;
      font-size: clamp(24px, 6.5vw, 34px);
      line-height: 1.14;
    }

    .start-card p {
      margin: 14px 0 20px;
      color: #dedbea;
      font-size: 15px;
      line-height: 1.45;
    }

    #startButton {
      width: 100%;
      padding: 15px 16px;
      border: 0;
      border-radius: 16px;
      color: #fff;
      background: linear-gradient(135deg, #7452ff, #b04dff);
      box-shadow: 0 10px 30px rgba(116, 82, 255, 0.38);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #startButton:active {
      transform: scale(0.98);
    }

    .bottom-hint {
      position: fixed;
      z-index: 10;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 50%;
      width: min(520px, calc(100% - 28px));
      transform: translateX(-50%);
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(10, 10, 20, 0.55);
      color: rgba(255, 255, 255, 0.82);
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .hidden {
      display: none;
    }

    @media (orientation: landscape) {
      #panorama {
        height: 120vh;
        transform: translate3d(-50%, -50%, 0) scale(1.18);
      }

      .status {
        max-width: 60%;
      }
    }
  </style>
</head>

<body>
  <main id="viewer">
    <img id="panorama" src="YuBIL360.png" alt="Панорамное изображение" />
  </main>

  <div class="top-panel">
    <div class="label">360°</div>
    <div class="status" id="status">Загрузка панорамы…</div>
  </div>

  <div class="bottom-hint" id="hint">
    После запуска можно поворачивать телефон, двигать панораму пальцем и приближать двумя пальцами.
  </div>

  <section class="start-screen" id="startScreen">
    <div class="start-card">
      <h1>Собери слово<br>из букв ^_^</h1>
      <p>Нажми «Начать», чтобы включить 360°-режим и открыть панораму.</p>
      <button id="startButton">Начать</button>
    </div>
  </section>

  <script>
    const viewer = document.getElementById("viewer");
    const panorama = document.getElementById("panorama");
    const startButton = document.getElementById("startButton");
    const startScreen = document.getElementById("startScreen");
    const status = document.getElementById("status");
    const hint = document.getElementById("hint");

    let imageWidth = 0;
    let imageHeight = 0;

    let currentX = 0;
    let targetX = 0;

    let scale = 1.22;
    let targetScale = 1.22;
    const minScale = 1.0;
    const maxScale = 1.8;

    let sensorEnabled = false;
    let sensorReady = false;
    let previousHeading = null;
    let targetHeading = 0;

    let isDragging = false;
    let dragStartX = 0;
    let dragStartPanoramaX = 0;

    let pinchStartDistance = 0;
    let pinchStartScale = 1.22;

    const smoothing = 0.11;
    const maxAngleJump = 25;
    const sensitivity = 1.15;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function getHeightForFit() {
      return Math.min(window.innerHeight * 1.22, window.innerHeight * 1.18 * (window.innerWidth > window.innerHeight ? 1 : 1));
    }

    function getScaledWidth() {
      if (!imageWidth || !imageHeight) return 0;
      const fittedHeight = window.innerHeight * 1.22;
      return imageWidth * (fittedHeight / imageHeight) * scale;
    }

    function getMaxShift() {
      return Math.max(0, (getScaledWidth() - window.innerWidth) / 2);
    }

    function applyTransform() {
      const limit = getMaxShift();
      targetX = clamp(targetX, -limit, limit);
      currentX += (targetX - currentX) * smoothing;

      if (Math.abs(targetX - currentX) < 0.05) {
        currentX = targetX;
      }

      const displayScale = scale;
      panorama.style.transform =
        `translate3d(calc(-50% + ${currentX}px), -50%, 0) scale(${displayScale})`;
    }

    function renderLoop() {
      applyTransform();
      requestAnimationFrame(renderLoop);
    }

    function setTargetX(value) {
      targetX = value;
    }

    function getHeading(event) {
      if (typeof event.webkitCompassHeading === "number") {
        return event.webkitCompassHeading;
      }

      if (typeof event.alpha === "number") {
        return 360 - event.alpha;
      }

      return null;
    }

    function angleDifference(current, previous) {
      let difference = current - previous;
      if (difference > 180) difference -= 360;
      if (difference < -180) difference += 360;
      return difference;
    }

    function onOrientation(event) {
      if (!sensorEnabled) return;

      const heading = getHeading(event);
      if (heading === null) return;

      if (!sensorReady) {
        previousHeading = heading;
        sensorReady = true;
        status.textContent = "360°-режим включён";
        return;
      }

      const difference = angleDifference(heading, previousHeading);

      if (Math.abs(difference) > maxAngleJump) {
        previousHeading = heading;
        return;
      }

      previousHeading = heading;
      targetHeading += difference;

      const pixelsPerDegree = (getScaledWidth() / 360) * sensitivity;
      setTargetX(-targetHeading * pixelsPerDegree);
    }

    function distanceBetweenTouches(e) {
      const [a, b] = e.touches;
      const dx = a.clientX - b.clientX;
      const dy = a.clientY - b.clientY;
      return Math.hypot(dx, dy);
    }

    viewer.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        pinchStartDistance = distanceBetweenTouches(e);
        pinchStartScale = targetScale;
      }
    }, { passive: true });

    viewer.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2) {
        const currentDistance = distanceBetweenTouches(e);
        if (pinchStartDistance > 0) {
          const ratio = currentDistance / pinchStartDistance;
          targetScale = clamp(pinchStartScale * ratio, minScale, maxScale);
        }
      }
    }, { passive: true });

    viewer.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "touch" && event.isPrimary === false) return;
      isDragging = true;
      dragStartX = event.clientX;
      dragStartPanoramaX = targetX;
      viewer.setPointerCapture(event.pointerId);
    });

    viewer.addEventListener("pointermove", (event) => {
      if (!isDragging) return;
      const difference = event.clientX - dragStartX;
      setTargetX(dragStartPanoramaX + difference);
    });

    function endDragging(event) {
      if (!isDragging) return;
      isDragging = false;
      if (viewer.hasPointerCapture(event.pointerId)) {
        viewer.releasePointerCapture(event.pointerId);
      }
    }

    viewer.addEventListener("pointerup", endDragging);
    viewer.addEventListener("pointercancel", endDragging);

    panorama.addEventListener("load", () => {
      imageWidth = panorama.naturalWidth;
      imageHeight = panorama.naturalHeight;
      status.textContent = "Панорама готова";
      setTargetX(0);
    });

    panorama.addEventListener("error", () => {
      status.textContent = "Не удалось загрузить изображение";
      status.classList.add("error");
    });

    window.addEventListener("resize", () => {
      setTargetX(targetX);
    });

    async function startExperience() {
      try {
        if (
          typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function"
        ) {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== "granted") throw new Error("denied");
        }

        sensorEnabled = true;
        sensorReady = false;
        previousHeading = null;
        targetHeading = 0;

        window.addEventListener("deviceorientation", onOrientation, true);

        startScreen.classList.add("hidden");
        status.textContent = "Повернись с телефоном";
        hint.textContent = "Поворачивай телефон, двигай панораму пальцем и приближай двумя пальцами.";

      } catch (error) {
        startScreen.classList.add("hidden");
        status.textContent = "Датчики не включены";
        status.classList.add("error");
        hint.textContent = "Панораму можно двигать пальцем и приближать двумя пальцами.";
      }
    }

    startButton.addEventListener("click", startExperience);

    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
