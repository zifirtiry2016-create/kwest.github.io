<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>360° Панорама</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080810;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overscroll-behavior: none;
    }

    #viewer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #11111b;
      touch-action: none;
      user-select: none;
    }

    #panorama {
      position: absolute;
      top: 50%;
      left: 50%;
      width: auto;
      max-width: none;
      user-select: none;
      pointer-events: none;
      -webkit-user-drag: none;
      will-change: transform;
      transform: translate3d(-50%, -50%, 0) scale(1.18);
      transform-origin: center center;
      height: 112vh;
    }

    .top-panel {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 10;
      pointer-events: none;
    }

    .label,
    .status {
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: rgba(10, 10, 20, 0.58);
      backdrop-filter: blur(10px);
      font-size: 13px;
      line-height: 1.2;
    }

    .status {
      color: #d9d9e7;
      text-align: right;
      max-width: 72%;
    }

    .error {
      color: #ffb9b9;
    }

    .word-button {
      position: fixed;
      z-index: 12;
      top: max(64px, env(safe-area-inset-top) + 44px);
      right: 14px;
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      color: #fff;
      background: linear-gradient(135deg, #24b47e, #12a6ff);
      box-shadow: 0 10px 30px rgba(18, 166, 255, 0.32);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      animation: wordButtonPulse 2s ease-in-out infinite;
    }

    .word-button::before {
      content: "";
      position: absolute;
      inset: -5px;
      z-index: -1;
      border: 2px solid rgba(103, 225, 255, 0.8);
      border-radius: inherit;
      opacity: 0;
      pointer-events: none;
      animation: wordButtonRing 2s ease-out infinite;
    }

    .word-button:active {
      transform: scale(0.96);
    }

    @keyframes wordButtonPulse {
      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 10px 30px rgba(18, 166, 255, 0.32);
      }

      50% {
        transform: scale(1.06);
        box-shadow:
          0 10px 35px rgba(18, 166, 255, 0.55),
          0 0 18px rgba(77, 255, 207, 0.52);
      }
    }

    @keyframes wordButtonRing {
      0% {
        opacity: 0.8;
        transform: scale(0.92);
      }

      70% {
        opacity: 0;
        transform: scale(1.27);
      }

      100% {
        opacity: 0;
        transform: scale(1.27);
      }
    }

    .start-screen,
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(6, 6, 14, 0.76);
      backdrop-filter: blur(12px);
    }

    .start-card,
    .modal-card {
      position: relative;
      width: min(420px, 100%);
      padding: 28px 20px 22px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      background: linear-gradient(150deg, rgba(53, 38, 104, 0.98), rgba(18, 18, 37, 0.98));
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .start-card h1,
    .modal-card h2 {
      margin: 0;
      font-size: clamp(24px, 6.5vw, 34px);
      line-height: 1.14;
    }

    .start-card p,
    .modal-card p {
      margin: 14px 0 20px;
      color: #dedbea;
      font-size: 15px;
      line-height: 1.45;
    }

    #startButton,
    #checkButton {
      width: 100%;
      padding: 15px 16px;
      border: 0;
      border-radius: 16px;
      color: #fff;
      background: linear-gradient(135deg, #7452ff, #b04dff);
      box-shadow: 0 10px 30px rgba(116, 82, 255, 0.38);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #startButton:active,
    #checkButton:active {
      transform: scale(0.98);
    }

    .close-button {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }

    .close-button:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.18);
    }

    .bottom-hint {
      position: fixed;
      z-index: 10;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 50%;
      width: min(520px, calc(100% - 28px));
      transform: translateX(-50%);
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(10, 10, 20, 0.55);
      color: rgba(255, 255, 255, 0.82);
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .modal {
      display: none;
      z-index: 30;
    }

    .modal input {
      width: 100%;
      margin: 0 0 14px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .modal input:focus {
      border-color: #9d7cff;
      box-shadow: 0 0 0 3px rgba(157, 124, 255, 0.18);
    }

    .modal input::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    .feedback {
      min-height: 44px;
      margin-top: 14px;
      font-size: 15px;
      line-height: 1.4;
    }

    .hidden {
      display: none;
    }

    @media (orientation: landscape) {
      #panorama {
        height: 124vh;
        transform: translate3d(-50%, -50%, 0) scale(1.14);
      }

      .status {
        max-width: 60%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .word-button,
      .word-button::before {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main id="viewer">
    <img id="panorama" src="YuBIL360.png" alt="Панорамное изображение" />
  </main>

  <div class="top-panel">
    <div class="label">360°</div>
    <div class="status" id="status">Загрузка панорамы…</div>
  </div>

  <button class="word-button" id="wordButton">проверить слово</button>

  <div class="bottom-hint" id="hint">
    После запуска можно поворачивать телефон, двигать панораму пальцем и приближать двумя пальцами.
  </div>

  <section class="start-screen" id="startScreen">
    <div class="start-card">
      <h1>Собери слово<br>из букв ^_^</h1>
      <p>Нажми «Начать», чтобы включить 360°-режим и открыть панораму.</p>
      <button id="startButton">Начать</button>
    </div>
  </section>

  <section
    class="modal"
    id="wordModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="wordModalTitle"
  >
    <div class="modal-card">
      <button
        class="close-button"
        id="closeWordButton"
        type="button"
        aria-label="Закрыть окно ввода слова"
      >
        ×
      </button>

      <h2 id="wordModalTitle">Введи слово</h2>
      <p>Подумай внимательно о том, что ты ищешь.</p>

      <input
        id="wordInput"
        type="text"
        placeholder="Напиши ответ"
        autocomplete="off"
      />

      <button id="checkButton" type="button">Проверить</button>

      <div class="feedback" id="feedback"></div>
    </div>
  </section>

  <script>
    const viewer = document.getElementById("viewer");
    const panorama = document.getElementById("panorama");
    const startButton = document.getElementById("startButton");
    const startScreen = document.getElementById("startScreen");
    const status = document.getElementById("status");
    const hint = document.getElementById("hint");

    const wordButton = document.getElementById("wordButton");
    const wordModal = document.getElementById("wordModal");
    const wordInput = document.getElementById("wordInput");
    const checkButton = document.getElementById("checkButton");
    const closeWordButton = document.getElementById("closeWordButton");
    const feedback = document.getElementById("feedback");

    let imageWidth = 0;
    let imageHeight = 0;

    let currentX = 0;
    let targetX = 0;

    let currentScale = 1.18;
    let targetScale = 1.18;
    const minScale = 1.0;
    const maxScale = 1.9;

    let sensorEnabled = false;
    let sensorReady = false;
    let previousHeading = null;
    let accumulatedRotation = 0;

    let isDragging = false;
    let dragStartX = 0;
    let dragStartPanoramaX = 0;

    let pinchStartDistance = 0;
    let pinchStartScale = 1.18;

    const smoothing = 0.11;
    const maxAngleJump = 25;
    const sensitivity = 1.15;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function isLandscape() {
      return window.innerWidth > window.innerHeight;
    }

    function getFitHeight() {
      return isLandscape()
        ? window.innerHeight * 1.24
        : window.innerHeight * 1.12;
    }

    function getScaledWidth() {
      if (!imageWidth || !imageHeight) return 0;
      return imageWidth * (getFitHeight() / imageHeight) * currentScale;
    }

    function getMaxShift() {
      return Math.max(0, (getScaledWidth() - window.innerWidth) / 2);
    }

    function renderLoop() {
      currentScale += (targetScale - currentScale) * 0.12;

      if (Math.abs(targetScale - currentScale) < 0.001) {
        currentScale = targetScale;
      }

      const limit = getMaxShift();
      targetX = clamp(targetX, -limit, limit);

      currentX += (targetX - currentX) * smoothing;

      if (Math.abs(targetX - currentX) < 0.05) {
        currentX = targetX;
      }

      panorama.style.transform =
        `translate3d(calc(-50% + ${currentX}px), -50%, 0) scale(${currentScale})`;

      requestAnimationFrame(renderLoop);
    }

    function setTargetX(value) {
      targetX = value;
    }

    function getHeading(event) {
      if (typeof event.webkitCompassHeading === "number") {
        return event.webkitCompassHeading;
      }

      if (typeof event.alpha === "number") {
        return 360 - event.alpha;
      }

      return null;
    }

    function angleDifference(current, previous) {
      let difference = current - previous;

      if (difference > 180) difference -= 360;
      if (difference < -180) difference += 360;

      return difference;
    }

    function onOrientation(event) {
      if (!sensorEnabled) return;

      const heading = getHeading(event);
      if (heading === null) return;

      if (!sensorReady) {
        previousHeading = heading;
        sensorReady = true;
        status.textContent = "360°-режим включён";
        return;
      }

      const difference = angleDifference(heading, previousHeading);

      if (Math.abs(difference) > maxAngleJump) {
        previousHeading = heading;
        return;
      }

      previousHeading = heading;
      accumulatedRotation += difference;

      const pixelsPerDegree = (getScaledWidth() / 360) * sensitivity;
      setTargetX(-accumulatedRotation * pixelsPerDegree);
    }

    function distanceBetweenTouches(e) {
      const [a, b] = e.touches;
      return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    }

    viewer.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        pinchStartDistance = distanceBetweenTouches(e);
        pinchStartScale = targetScale;
      }
    }, { passive: true });

    viewer.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2) {
        const currentDistance = distanceBetweenTouches(e);

        if (pinchStartDistance > 0) {
          const ratio = currentDistance / pinchStartDistance;
          targetScale = clamp(pinchStartScale * ratio, minScale, maxScale);
        }
      }
    }, { passive: true });

    viewer.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "touch" && event.isPrimary === false) return;

      isDragging = true;
      dragStartX = event.clientX;
      dragStartPanoramaX = targetX;
      viewer.setPointerCapture(event.pointerId);
    });

    viewer.addEventListener("pointermove", (event) => {
      if (!isDragging) return;

      const difference = event.clientX - dragStartX;
      setTargetX(dragStartPanoramaX + difference);
    });

    function endDragging(event) {
      if (!isDragging) return;

      isDragging = false;

      if (viewer.hasPointerCapture(event.pointerId)) {
        viewer.releasePointerCapture(event.pointerId);
      }
    }

    viewer.addEventListener("pointerup", endDragging);
    viewer.addEventListener("pointercancel", endDragging);

    panorama.addEventListener("load", () => {
      imageWidth = panorama.naturalWidth;
      imageHeight = panorama.naturalHeight;
      status.textContent = "Панорама готова";
      setTargetX(0);
    });

    panorama.addEventListener("error", () => {
      status.textContent = "Не удалось загрузить изображение";
      status.classList.add("error");
    });

    window.addEventListener("resize", () => {
      setTargetX(targetX);
    });

    async function startExperience() {
      try {
        if (
          typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function"
        ) {
          const permission = await DeviceOrientationEvent.requestPermission();

          if (permission !== "granted") {
            throw new Error("denied");
          }
        }

        sensorEnabled = true;
        sensorReady = false;
        previousHeading = null;
        accumulatedRotation = 0;

        window.addEventListener("deviceorientation", onOrientation, true);

        startScreen.classList.add("hidden");
        status.textContent = "Повернись с телефоном";
        hint.textContent =
          "Поворачивай телефон, двигай панораму пальцем и приближай двумя пальцами.";

      } catch (error) {
        startScreen.classList.add("hidden");
        status.textContent = "Датчики не включены";
        status.classList.add("error");
        hint.textContent =
          "Панораму можно двигать пальцем и приближать двумя пальцами.";
      }
    }

    function openWordModal() {
      wordModal.style.display = "grid";
      feedback.textContent = "";
      feedback.style.color = "";
      wordInput.value = "";
      wordInput.focus();
    }

    function closeWordModal() {
      wordModal.style.display = "none";
      wordButton.focus();
    }

    function checkWord() {
      const value = wordInput.value.trim().toLowerCase();

      if (value === "гезамткунстверк") {
        feedback.textContent =
          "Верно! Ты просто умничка :3 целую в носик! Обязательно запомни это слово";
        feedback.style.color = "#9effc1";
      } else {
        feedback.textContent = "Смотри внимательнее >:(";
        feedback.style.color = "#ffb9b9";
      }
    }

    startButton.addEventListener("click", startExperience);

    wordButton.addEventListener("click", openWordModal);
    closeWordButton.addEventListener("click", closeWordModal);
    checkButton.addEventListener("click", checkWord);

    wordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") checkWord();

      if (event.key === "Escape") closeWordModal();
    });

    document.addEventListener("keydown", (event) => {
      if (
        event.key === "Escape" &&
        wordModal.style.display === "grid"
      ) {
        closeWordModal();
      }
    });

    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
