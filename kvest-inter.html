<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка знаний</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink: #ff7ad9;
    --blue: #5aa7ff;
    --purple: #8b5cf6;
    --text: #f4f0ff;
    --muted: #b9aed6;
  }

  html, body { min-height: 100%; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
    background: linear-gradient(135deg, #2b1055 0%, #7597de 50%, #ff6ec7 100%);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
  }

  .glow { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .5; z-index: 0; pointer-events: none; }
  .glow-1 { width: 320px; height: 320px; background: var(--pink); top: -80px; left: -80px; }
  .glow-2 { width: 360px; height: 360px; background: var(--blue); bottom: -100px; right: -60px; }
  .glow-3 { width: 280px; height: 280px; background: var(--purple); top: 40%; left: 55%; }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    background: rgba(255, 255, 255, .1);
    border: 1px solid rgba(255, 255, 255, .25);
    border-radius: 24px;
    padding: clamp(20px, 5vw, 40px);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(43, 16, 85, .45);
    text-align: center;
  }

  h1 { font-size: clamp(20px, 5vw, 26px); }

  .progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .progress-label { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .85; white-space: nowrap; }
  .progress-bar { flex: 1; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .18); overflow: hidden; }
  .progress-fill { height: 100%; width: 33.3%; border-radius: 99px; background: linear-gradient(90deg, var(--pink), var(--purple), var(--blue)); transition: width .5s ease; }

  .emoji { font-size: clamp(40px, 9vw, 64px); letter-spacing: 6px; margin: 22px 0 8px; line-height: 1.4; }

  .question { font-size: clamp(15px, 4vw, 18px); line-height: 1.55; opacity: .95; margin-bottom: 18px; }

  .hint { font-size: 13px; opacity: .7; margin-bottom: 14px; }

  .input-row { display: flex; gap: 10px; }

  input {
    flex: 1;
    min-width: 0;
    padding: 14px 16px;
    font-size: 16px;
    border-radius: 14px;
    border: 2px solid rgba(255, 255, 255, .3);
    background: rgba(255, 255, 255, .12);
    color: var(--text);
    outline: none;
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  input::placeholder { color: rgba(255, 255, 255, .55); }
  input:focus { border-color: var(--blue); background: rgba(255, 255, 255, .16); box-shadow: 0 0 0 4px rgba(79, 172, 254, .25); }
  input.error { border-color: #ff5d7a; animation: shake .35s; }

  button {
    padding: 14px 22px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border: none;
    border-radius: 14px;
    cursor: pointer;
    min-height: 48px;
    transition: transform .15s, box-shadow .2s, opacity .2s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255, 110, 199, .35); }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .6; cursor: default; transform: none; }

  .feedback {
    margin-top: 16px;
    font-size: clamp(15px, 4vw, 17px);
    font-weight: 600;
    min-height: 26px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .35s, transform .35s;
  }
  .feedback.show { opacity: 1; transform: none; }
  .feedback.success { color: #7dffb0; }
  .feedback.fail { color: #ffb3c1; }

  .next-btn { margin-top: 18px; display: none; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  @media (max-width: 400px) {
    .input-row { flex-direction: column; }
    button { width: 100%; }
  }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <div class="card">
    <div class="progress-wrap">
      <span class="progress-label" id="progressLabel">Уровень 1/3</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <h1 id="levelTitle">Уровень 1</h1>
    <div class="emoji" id="emojiBox">👆 🖱️ 💬 🔄</div>
    <p class="question" id="questionText">Какой термин мультимедиа скрывается за этими эмодзи?</p>
    <p class="hint" id="hintText">Введи ответ и нажми «Проверить»</p>

    <div class="input-row" id="inputRow">
      <input id="answerInput" type="text" placeholder="Твой ответ…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="checkBtn">Проверить</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">Дальше →</button>
  </div>

<script>
  const levels = [
    { emoji: '👆 🖱️ 💬 🔄', answers: ['интерактивность', 'интерактив', 'интерактивности'] },
    { emoji: '🖥️ 🥽 ✨ 🌆', answers: ['виртуальная реальность', 'виртуальной реальности', 'виртуальную реальность', 'виртуальная', 'виар', 'vr'] },
    { emoji: '🎮 👾 🕹️ 📺', answers: ['видеоигра', 'видео игра', 'видеоигру', 'видео игру', 'игра', 'компьютерная игра', 'компьютерная'] }
  ];

  let current = 0;

  const titleEl = document.getElementById('levelTitle');
  const emojiBox = document.getElementById('emojiBox');
  const questionText = document.getElementById('questionText');
  const hintText = document.getElementById('hintText');
  const progressLabel = document.getElementById('progressLabel');
  const progressFill = document.getElementById('progressFill');
  const inputRow = document.getElementById('inputRow');
  const input = document.getElementById('answerInput');
  const checkBtn = document.getElementById('checkBtn');
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');

  function normalize(s) {
    return s.toLowerCase()
      .replace(/ё/g, 'е')
      .replace(/[^a-zа-я0-9\s]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function renderLevel() {
    const level = levels[current];
    titleEl.textContent = 'Уровень ' + (current + 1);
    progressLabel.textContent = 'Уровень ' + (current + 1) + '/' + levels.length;
    progressFill.style.width = ((current + 1) / levels.length * 100) + '%';
    emojiBox.textContent = level.emoji;
    questionText.textContent = 'Какой термин мультимедиа скрывается за этими эмодзи?';
    hintText.style.display = '';
    inputRow.style.display = '';
    input.value = '';
    input.disabled = false;
    checkBtn.disabled = false;
    nextBtn.textContent = 'Дальше →';
    nextBtn.style.display = 'none';
    feedback.classList.remove('show', 'success', 'fail');
    feedback.textContent = '';
    input.focus();
  }

  function showFeedback(text, type) {
    feedback.textContent = text;
    feedback.classList.remove('success', 'fail');
    feedback.classList.add('show', type);
  }

  function correct() {
    showFeedback('Правильный ответ. Ты близок к цели.', 'success');
    input.disabled = true;
    checkBtn.disabled = true;
    if (current < levels.length - 1) {
      nextBtn.style.display = 'inline-block';
    } else {
      finishQuest();
    }
  }

  function wrong() {
    showFeedback('Не угадал.', 'fail');
    input.classList.add('error');
    setTimeout(() => input.classList.remove('error'), 400);
    input.focus();
    input.select();
  }

  function checkAnswer() {
    const value = normalize(input.value);
    if (!value) return;
    if (levels[current].answers.some(a => normalize(a) === value)) {
      correct();
    } else {
      wrong();
    }
  }

  function finishQuest() {
    titleEl.textContent = '🎉 Квест пройден!';
    questionText.textContent = 'В этот раз ты победил. Запомни слово и его форму: полного';
    hintText.style.display = 'none';
    inputRow.style.display = 'none';
    feedback.classList.remove('show', 'success', 'fail');
    feedback.textContent = '';
    nextBtn.textContent = '🔄 Пройти заново';
    nextBtn.style.display = 'inline-block';
  }

  checkBtn.addEventListener('click', checkAnswer);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') checkAnswer();
  });

  nextBtn.addEventListener('click', () => {
    if (current < levels.length - 1) {
      current++;
    } else {
      current = 0;
    }
    renderLevel();
  });

  renderLevel();
</script>
</body>
</html>
