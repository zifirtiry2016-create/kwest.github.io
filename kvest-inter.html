<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Квест: угадай термин мультимедиа</title>
  <style>
    :root {
      --bg: #eef1f8;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #697086;
      --accent: #5b5bd6;
      --accent-dark: #4545b8;
      --border: #e3e7f0;
      --error: #d64545;
      --success-bg: #eafaf0;
      --success-border: #27ae60;
    }

    *,
    *::before,
    *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      line-height: 1.5;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 14px 44px rgba(31, 36, 48, 0.14);
      padding: clamp(24px, 6vw, 40px);
      width: 100%;
      max-width: 460px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(91, 91, 214, .1);
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .subtitle { color: var(--muted); font-size: 15px; margin-bottom: 22px; }

    .emoji-row {
      display: flex;
      justify-content: center;
      gap: clamp(6px, 2vw, 12px);
      font-size: clamp(44px, 14vw, 64px);
      margin: 24px 0;
      line-height: 1;
    }

    .emoji-row span {
      animation: pop .5s ease both;
      cursor: default;
    }
    .emoji-row span:nth-child(2) { animation-delay: .1s; }
    .emoji-row span:nth-child(3) { animation-delay: .2s; }
    .emoji-row span:nth-child(4) { animation-delay: .3s; }

    @keyframes pop {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .field {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 17px;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #fafbfe;
      color: var(--text);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(91, 91, 214, .15);
      background: #fff;
    }

    button {
      font: inherit;
      font-weight: 600;
      font-size: 17px;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      cursor: pointer;
      min-height: 48px;
      flex-shrink: 0;
      touch-action: manipulation;
      transition: background .15s, transform .1s;
    }

    button:hover  { background: var(--accent-dark); }
    button:active { transform: scale(.97); }

    .msg {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      text-align: left;
    }

    .msg.error {
      color: var(--error);
      background: #fdf0f0;
      border: 1px solid #f3caca;
    }

    .msg.success {
      background: var(--success-bg);
      border: 2px solid var(--success-border);
      color: #14532d;
      animation: fadeIn .45s ease;
    }

    .msg.success .word {
      display: inline-block;
      margin-top: 8px;
      padding: 2px 10px;
      border-radius: 8px;
      font-weight: 700;
      color: #15803d;
      background: #d9f5e3;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.show { display: block; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 360px) {
      .field { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <span class="badge">Квест · мультимедиа</span>
    <h1>Угадай термин по эмодзи</h1>
    <p class="subtitle">Какой термин мультимедиа скрывается за этими символами?</p>

    <div class="emoji-row" aria-hidden="true">
      <span>👆</span><span>🖱️</span><span>💬</span><span>🎮</span>
    </div>

    <form id="quiz" novalidate>
      <label class="visually-hidden" for="answer">Введи термин</label>
      <div class="field">
        <input type="text" id="answer" name="answer" placeholder="Твой ответ…"
               autocomplete="off" autocapitalize="off" spellcheck="false"
               inputmode="text" maxlength="40">
        <button type="submit" id="submit">Проверить</button>
      </div>
      <p class="msg error" id="error" role="alert">Не угадал.</p>
    </form>

    <div class="msg success" id="success" role="status">
      <p><strong>Правильный ответ.</strong> Ты близок к цели.</p>
      <p>Запомни слово: <span class="word">флюксусная</span></p>
    </div>
  </main>

  <script>
    const correct = ["интерактивность", "интерактив", "интерактивности"];

    const form = document.getElementById("quiz");
    const input = document.getElementById("answer");
    const error = document.getElementById("error");
    const success = document.getElementById("success");
    const submitBtn = document.getElementById("submit");

    const normalize = (value) =>
      value.toLowerCase()
           .replace(/ё/g, "е")
           .replace(/[^\p{L}\p{N}]/gu, "")
           .trim();

    const showSuccess = () => {
      error.classList.remove("show");
      success.classList.add("show");
      input.disabled = true;
      submitBtn.disabled = true;
      success.scrollIntoView({ behavior: "smooth", block: "nearest" });
    };

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (correct.includes(normalize(input.value))) {
        showSuccess();
      } else {
        success.classList.remove("show");
        error.classList.add("show");
        input.focus();
        input.select();
      }
    });
  </script>
</body>
</html>
