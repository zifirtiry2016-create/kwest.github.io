<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Последовательность кадров</title>
    <style>
      body {
        font-family: sans-serif;
        background: #05050a;
        color: #e0e0e0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .puzzle-box {
        text-align: center;
        max-width: 500px;
        width: 90%;
      }
      #frame-image {
        width: 100%;
        height: 300px;
        object-fit: contain;
        border-radius: 6px;
        box-shadow: 0 0 20px rgba(0,0,0,0.6);
        margin-bottom: 15px;
        /* Если картинка не загрузится, будет видна эта рамка */
        border: 2px dashed #555;
      }
      button {
        padding: 12px 24px;
        font-size: 1rem;
        cursor: pointer;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 4px;
        margin: 0 5px;
      }
      input {
        padding: 10px;
        font-size: 1rem;
        width: 200px;
        text-align: center;
      }
      #status {
        margin-top: 15px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="puzzle-box">
      <h2>Монтажная последовательность</h2>
      <p>Смотри на кадры. На одном из них будет видна цифра. Останови показ и введи её.</p>
      <!-- Картинка без заглушек: src будет меняться через JS -->
      <img id="frame-image" src="" alt="Кадр" onerror="this.alt='Картинка не найдена'">
      <div style="margin-bottom:10px;">
        <button onclick="togglePlay()">Стоп / Старт</button>
      </div>
      <input type="number" id="answer" placeholder="Цифра с кадра">
      <button onclick="checkAnswer()">Проверить</button>
      <div id="status"></div>
    </div>

    <script>
      // ПУТИ К ТВОИМ КАРТИНКАМ — МЕНЯТЬ ТОЛЬКО ЕСЛИ ДРУГАЯ СТРУКТУРА
      const frames = [
        'img/frame1.jpg',
        'img/frame2.jpg',
        'img/frame3.jpg',
        'img/frame4.jpg'
      ];

      let currentFrameIndex = 0;
      let slideInterval;
      const img = document.getElementById('frame-image');
      const status = document.getElementById('status');
      let isPlaying = true;

      function nextFrame() {
        currentFrameIndex = (currentFrameIndex + 1) % frames.length;
        img.src = frames[currentFrameIndex];
      }

      function startSlideshow() {
        slideInterval = setInterval(nextFrame, 1200);
      }

      function togglePlay() {
        if (isPlaying) {
          clearInterval(slideInterval);
          status.textContent = 'Показ остановлен. Введи найденную цифру.';
          status.style.color = '#fff';
        } else {
          startSlideshow();
          status.textContent = '';
        }
        isPlaying = !isPlaying;
      }

      function checkAnswer() {
        const answer = document.getElementById('answer').value.trim();
        // ПРАВИЛЬНЫЙ ОТВЕТ — поставь сюда цифру, которая есть на твоём 3‑м кадре
        if (answer === '6') {
          status.textContent = 'Верно! Ты заметил деталь. Доступ открыт.';
          status.style.color = '#55ff55';
          // window.location.href = 'next-room.html';
        } else {
          status.textContent = 'Неверно. Пересмотри кадры внимательнее.';
          status.style.color = '#ff5555';
        }
      }

      // Запуск при загрузке страницы
      img.src = frames[0];
      startSlideshow();
    </script>
  </body>
</html>
