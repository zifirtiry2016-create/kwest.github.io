<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Станция терминов мультимедиа</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    background: linear-gradient(135deg, #1e0a3c 0%, #5b2a86 50%, #1e3a8a 100%);
    background-attachment: fixed;
    color: #f3eaff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: 100%;
    max-width: 860px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }

  h1 { font-size: 28px; text-align: center; margin-bottom: 24px; }

  .timer-wrap { text-align: center; margin-bottom: 24px; }
  .timer {
    display: inline-block;
    font-size: 42px; font-weight: 800;
    color: #ff6ec7;
    background: rgba(0,0,0,.3);
    padding: 4px 30px;
    border-radius: 999px;
    border: 2px solid rgba(255,110,199,.4);
    font-variant-numeric: tabular-nums;
    min-width: 110px;
  }
  .timer.low { color: #ff4d6d; border-color: #e11d48; animation: pulse 1s infinite; }
  .timer.hidden { display: none; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  .node-title { text-align: center; font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #ff9fe0; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
  .tile {
    padding: 20px 16px; text-align: center; font-size: 16px; font-weight: 600;
    background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.18);
    border-radius: 14px; cursor: pointer; user-select: none;
    touch-action: manipulation;
    transition: transform .15s, background .15s, border-color .15s;
  }
  .tile:hover { transform: translateY(-3px); background: rgba(255,255,255,.18); border-color: #ff6ec7; }
  .tile:active { transform: scale(.97); }
  .tile.wrong { animation: shake .4s; border-color: #e11d48; background: rgba(225,29,72,.25); }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-4px); }
  }

  #message { min-height: 24px; text-align: center; margin: 18px 0 4px; font-size: 15px; color: #ffb3e6; }

  .controls { display: flex; justify-content: flex-start; align-items: center; margin-top: 20px; }
  button {
    padding: 10px 18px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; background: linear-gradient(135deg, #a855f7, #ec4899); color: #fff;
    touch-action: manipulation;
    transition: opacity .15s, transform .15s;
  }
  button:hover { opacity: .9; transform: translateY(-1px); }
  button:disabled { opacity: .35; cursor: not-allowed; transform: none; }

  .win { text-align: center; padding: 30px 10px; }
  .win .emoji { font-size: 64px; animation: pop .6s; }
  .win h2 { font-size: 26px; margin: 12px 0; color: #ff9fe0; }
  .win p { color: #d5b8f0; margin-bottom: 12px; line-height: 1.6; }
  .win .found {
    display: inline-block; padding: 14px 28px; margin: 10px 0 24px;
    font-size: 20px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #ff6ec7, #a855f7);
    border-radius: 14px; box-shadow: 0 8px 24px rgba(236,72,153,.4);
  }
  .win .trap-msg {
    display: inline-block; padding: 14px 28px; margin: 10px 0 16px;
    font-size: 20px; font-weight: 700; color: #ffe3e3;
    background: rgba(225,29,72,.25); border: 2px solid #e11d48;
    border-radius: 14px;
  }
  .win button + button { margin-left: 12px; }

  .question {
    max-width: 520px; margin: 0 auto;
    background: rgba(255,255,255,.07);
    border: 2px solid rgba(255,110,199,.35);
    border-radius: 18px; padding: 26px 22px;
  }
  .question .q-text {
    font-size: 17px; line-height: 1.55; color: #f3eaff;
    margin: 6px 0 18px;
  }
  .question input[type="text"] {
    width: 100%;
    padding: 13px 14px;
    font-size: 16px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.3);
    color: #f3eaff;
    outline: none;
    text-align: center;
    margin-bottom: 14px;
    touch-action: manipulation;
  }
  .question input[type="text"]:focus { border-color: #ff6ec7; }
  .question input[type="text"].wrong { border-color: #e11d48; animation: shake .4s; }
  .question .q-msg { min-height: 24px; margin-top: 12px; font-size: 15px; color: #ffb3e6; }
  .question .q-ok { color: #7CFC9A; }

  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }

  /* ——— Оверлеи: заставка и таймаут ——— */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(30,10,60,.93);
    backdrop-filter: blur(5px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay-card {
    max-width: 430px; width: 100%;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 20px; padding: 30px 24px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .overlay-card .emoji { font-size: 56px; margin-bottom: 8px; }
  .overlay-card h2 { color: #ff9fe0; margin-bottom: 14px; font-size: 24px; }
  .overlay-card p { color: #e6d7f7; line-height: 1.65; margin-bottom: 24px; font-size: 16px; }
  .overlay-card button { width: 100%; padding: 14px; font-size: 17px; border-radius: 12px; }

  /* ——— ВЕРТИКАЛЬНЫЙ ТЕЛЕФОН (портрет) ——— */
  @media (max-width: 600px) {
    body { padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
    .wrap { padding: 16px 12px; border-radius: 18px; }
    h1 { font-size: 21px; margin-bottom: 14px; }
    .timer-wrap { margin-bottom: 14px; }
    .timer { font-size: 32px; min-width: 84px; padding: 3px 18px; }
    .node-title { font-size: 16px; margin-bottom: 12px; line-height: 1.4; }
    .tiles { grid-template-columns: 1fr; gap: 10px; }
    .tile {
      padding: 15px 14px;
      font-size: 15px;
      min-height: 54px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      line-height: 1.35;
      width: 100%;
    }
    #message { font-size: 14px; margin: 14px 0 2px; min-height: 20px; }
    .controls { margin-top: 14px; }
    button { padding: 12px 20px; font-size: 15px; border-radius: 12px; }
    .win { padding: 14px 2px; }
    .win .emoji { font-size: 46px; }
    .win h2 { font-size: 20px; line-height: 1.35; }
    .win p { font-size: 14px; }
    .win .found, .win .trap-msg { font-size: 16px; padding: 12px 16px; margin: 8px 0 18px; }
    .win button { width: 100%; margin: 6px 0; }
    .win button + button { margin-left: 0; }
    .question { padding: 18px 14px; border-radius: 14px; }
    .question .q-text { font-size: 15px; }
    .question input[type="text"] { font-size: 16px; padding: 14px 12px; }
    .question button { width: 100%; }
    .overlay { padding: 16px; }
    .overlay-card { padding: 22px 18px; border-radius: 16px; }
    .overlay-card .emoji { font-size: 48px; }
    .overlay-card h2 { font-size: 21px; margin-bottom: 12px; }
    .overlay-card p { font-size: 15px; margin-bottom: 18px; }
    .overlay-card button { padding: 14px; font-size: 16px; }
  }

  /* ——— Очень узкие телефоны (ширина ≤ 360px) ——— */
  @media (max-width: 360px) {
    body { padding: 8px; }
    .wrap { padding: 14px 10px; }
    h1 { font-size: 19px; }
    .timer { font-size: 28px; min-width: 76px; }
    .tile { font-size: 14px; padding: 13px 12px; min-height: 50px; }
    .node-title { font-size: 15px; }
    .win .found, .win .trap-msg { font-size: 14px; padding: 10px 12px; }
    .win h2 { font-size: 18px; }
  }

  /* ——— Низкие экраны: чтобы всё помещалось по высоте ——— */
  @media (max-height: 640px) and (max-width: 600px) {
    body { align-items: flex-start; padding-top: 12px; }
    .wrap { padding: 12px 12px; }
    h1 { font-size: 18px; margin-bottom: 8px; }
    .timer-wrap { margin-bottom: 8px; }
    .timer { font-size: 26px; padding: 2px 14px; min-width: 70px; }
    .node-title { font-size: 14px; margin-bottom: 8px; }
    .tiles { gap: 7px; }
    .tile { padding: 10px 12px; min-height: 44px; font-size: 13px; }
    #message { margin: 8px 0 0; min-height: 16px; font-size: 13px; }
    .controls { margin-top: 8px; }
    button { padding: 9px 16px; font-size: 13px; }
    .win { padding: 8px 0; }
    .win .emoji { font-size: 36px; }
    .win .found, .win .trap-msg { padding: 8px 12px; margin: 6px 0 12px; font-size: 14px; }
    .question { padding: 12px; }
    .question .q-text { font-size: 14px; margin: 4px 0 10px; }
    .question input[type="text"] { padding: 10px; font-size: 14px; margin-bottom: 10px; }
    .overlay-card { padding: 16px 14px; }
    .overlay-card .emoji { font-size: 36px; }
    .overlay-card h2 { font-size: 18px; margin-bottom: 8px; }
    .overlay-card p { font-size: 14px; margin-bottom: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 Квест</h1>
  <div class="timer-wrap"><span class="timer hidden" id="timer">15</span></div>
  <div class="node-title" id="nodeTitle"></div>
  <div class="tiles" id="tiles"></div>
  <div id="message"></div>
  <div class="controls">
    <button id="backBtn">← Назад</button>
  </div>
</div>

<!-- Заставка -->
<div class="overlay" id="startOverlay">
  <div class="overlay-card">
    <div class="emoji">🎬</div>
    <h2>Квест</h2>
    <p>Найди режиссуру мультимедиа. Будь внимателен, для этого у тебя есть всего лишь 15 секунд.</p>
    <button id="startBtn">Начать!</button>
  </div>
</div>

<!-- Таймаут -->
<div class="overlay hidden" id="timeoutOverlay">
  <div class="overlay-card">
    <div class="emoji">⏰</div>
    <h2>Время вышло!</h2>
    <p>Ты не успел, но можешь попробовать ещё раз, перезапустив игру!</p>
    <button id="restartBtn">🔄 Перезапустить игру</button>
  </div>
</div>

<script>
const TIME_LIMIT = 15;

const nodes = {
  institutes: {
    title: 'Выбери институт',
    options: [
      { label: 'СПбГУИКиТ', to: 'gup_faculties' },
      { label: 'СПбГИКиТ', to: 'gikit_faculties' }
    ]
  },

  // ——— Ветка СПбГИКиТ (правильная) ———
  gikit_faculties: {
    title: 'Выбери факультет СПбГИКиТ',
    options: [
      { label: 'ФЭИ', to: 'levels' },
      { label: 'ФМТ', to: 'fmt_levels' }
    ]
  },
  levels: {
    title: 'Выбери уровень образования',
    options: [
      { label: 'Бакалавриат', wrong: true },
      { label: 'Магистратура', wrong: true },
      { label: 'Специалитет', to: 'specialties' }
    ]
  },
  specialties: {
    title: 'Выбери специальность',
    options: [
      { label: 'Режиссура кино и телевидения', to: 'directions' },
      { label: 'Звукорежиссура аудиовизуальных искусств', wrong: true },
      { label: 'Кинооператорство', wrong: true },
      { label: 'Актёрское искусство', wrong: true },
      { label: 'Продюсерство', wrong: true },
      { label: 'Киноведение', wrong: true },
      { label: 'Графика', wrong: true }
    ]
  },
  directions: {
    title: 'Выбери направление',
    options: [
      { label: 'Режиссёр игрового кино', wrong: true },
      { label: 'Режиссёр неигрового кино', wrong: true },
      { label: 'Режиссёр анимации', wrong: true },
      { label: 'Режиссёр телевизионных фильмов', wrong: true },
      { label: 'Режиссёр мультимедиа', win: true }
    ]
  },

  // ——— Ветка ФМТ (путь-обманка) ———
  fmt_levels: {
    title: 'Выбери уровень образования (ФМТ)',
    options: [
      { label: 'Бакалавриат', to: 'fmt_programs' },
      { label: 'Магистратура', to: 'fmt_programs' }
    ]
  },
  fmt_programs: {
    title: 'Выбери программу',
    options: [
      { label: 'Реклама и связи с общественностью', wrong: true, msg: 'Кажется, ты совсем запутался' },
      { label: 'Журналистика', wrong: true, msg: 'Кажется, ты совсем запутался' },
      { label: 'Информационные системы и технологии', wrong: true, msg: 'Кажется, ты совсем запутался' },
      { label: 'Радиотехника', wrong: true, msg: 'Кажется, ты совсем запутался' },
      { label: 'Телевидение', wrong: true, msg: 'Кажется, ты совсем запутался' },
      { label: 'Искусства и гуманитарные науки', wrong: true, msg: 'Кажется, ты совсем запутался' },
      { label: 'Народная художественная культура', wrong: true, msg: 'Кажется, ты совсем запутался' },
      { label: 'Реставрация', wrong: true, msg: 'Кажется, ты совсем запутался' }
    ]
  },

  // ——— Ветка СПбГУП (путь-ловушка) ———
  gup_faculties: {
    title: 'Выбери факультет СПбГУП',
    options: [
      { label: 'Факультет культуры', wrong: true, msg: 'Кажется, что-то не то.' },
      { label: 'Факультет искусств', to: 'gup_levels' },
      { label: 'Экономический факультет', wrong: true, msg: 'Ты что, забыл, как каша дома пахнет? НЕПРАВИЛЬНЫЙ ПУТЬ!' },
      { label: 'Юридический факультет', wrong: true, msg: 'Ты что, забыл, как каша дома пахнет? НЕПРАВИЛЬНЫЙ ПУТЬ!' },
      { label: 'Факультет конфликтологии', wrong: true, msg: 'Ты что, забыл, как каша дома пахнет? НЕПРАВИЛЬНЫЙ ПУТЬ!' }
    ]
  },
  gup_levels: {
    title: 'Выбери уровень образования',
    options: [
      { label: 'Бакалавриат', wrong: true, msg: 'Неправильно. Твой путь изначально вызывал сомнение.' },
      { label: 'Специалитет', to: 'gup_specialties' },
      { label: 'Магистратура', wrong: true, msg: 'Неправильно. Твой путь изначально вызывал сомнение.' }
    ]
  },
  gup_specialties: {
    title: 'Выбери специальность',
    options: [
      { label: 'История искусств', wrong: true, msg: 'Ты что, забыл, как каша дома пахнет? НЕПРАВИЛЬНЫЙ ПУТЬ!' },
      { label: 'Музыкальная звукорежиссура', wrong: true, msg: 'Ты что, забыл, как каша дома пахнет? НЕПРАВИЛЬНЫЙ ПУТЬ!' },
      { label: 'Народная художественная культура', wrong: true, msg: 'Ты что, забыл, как каша дома пахнет? НЕПРАВИЛЬНЫЙ ПУТЬ!' },
      { label: 'Режиссура кино и телевидения', to: 'gup_directions' },
      { label: 'Актёрское искусство', wrong: true, msg: 'Ты что, забыл, как каша дома пахнет? НЕПРАВИЛЬНЫЙ ПУТЬ!' },
      { label: 'Режиссура театра', wrong: true, msg: 'Ты что, забыл, как каша дома пахнет? НЕПРАВИЛЬНЫЙ ПУТЬ!' }
    ]
  },
  gup_directions: {
    title: 'Выбери направление',
    options: [
      { label: 'Режиссура мультимедиа', trap: true, msg: 'Ты нашёл режиссуру мультимедиа... Но ту ли?' }
    ]
  }
};

let history = ['institutes'];
let finished = false;
let trapped = false;
let awaitingAnswer = false;

let timeLeft = TIME_LIMIT;
let timerId = null;

const tilesEl = document.getElementById('tiles');
const titleEl = document.getElementById('nodeTitle');
const msgEl = document.getElementById('message');
const backBtn = document.getElementById('backBtn');
const timerEl = document.getElementById('timer');
const startOverlay = document.getElementById('startOverlay');
const timeoutOverlay = document.getElementById('timeoutOverlay');

function current() { return nodes[history[history.length - 1]]; }

function render() {
  const node = current();
  tilesEl.innerHTML = '';
  msgEl.textContent = '';

  if (awaitingAnswer) { renderQuestion(); return; }
  if (finished) { renderWin(); return; }
  if (trapped) { renderTrap(); return; }

  backBtn.disabled = history.length <= 1;
  titleEl.textContent = node.title;
  node.options.forEach(opt => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.textContent = opt.label;
    tile.addEventListener('click', () => onTileClick(opt, tile));
    tilesEl.appendChild(tile);
  });
}

function onTileClick(opt, tile) {
  if (opt.win) {
    awaitingAnswer = true;
    stopTimer();
    render();
    return;
  }
  if (opt.trap) {
    trapped = true;
    render();
    return;
  }
  if (opt.to) {
    history.push(opt.to);
    render();
    return;
  }
  tile.classList.add('wrong');
  msgEl.textContent = opt.msg || '❌ Что-то явно не то...';
  setTimeout(() => tile.classList.remove('wrong'), 500);
}

// ——— Финальный вопрос ———
function renderQuestion() {
  titleEl.textContent = '';
  backBtn.disabled = true;
  tilesEl.innerHTML = `
    <div class="win">
      <div class="emoji">🎉</div>
      <h2>Ты нашёл режиссуру мультимедиа!</h2>
      <div class="question">
        <p class="q-text">Для того чтобы найти режиссуру мультимедиа, ты переходил по ссылкам. Как это называется?</p>
        <input type="text" id="answerInput" placeholder="Твой ответ..." autocomplete="off">
        <button onclick="submitAnswer()">Ответить</button>
        <div class="q-msg" id="qMsg"></div>
      </div>
    </div>`;
  const input = document.getElementById('answerInput');
  input.focus();
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitAnswer();
  });
}

function normalizeAnswer(s) {
  return s.toLowerCase().replace(/\s+/g, ' ').trim();
}

function isCorrectAnswer(s) {
  const n = normalizeAnswer(s);
  // Принимаем: гипертекстуальность, гипертекст, гиперссылки (и их формы)
  return n.includes('гипертекст') || n.includes('гиперссылк');
}

function submitAnswer() {
  const input = document.getElementById('answerInput');
  const qMsg = document.getElementById('qMsg');
  if (!input) return;
  const val = input.value.trim();
  if (!val) {
    qMsg.textContent = 'Введи ответ!';
    return;
  }
  if (isCorrectAnswer(val)) {
    awaitingAnswer = false;
    finished = true;
    qMsg.innerHTML = '✅ <span class="q-ok">Правильно!</span>';
    setTimeout(() => render(), 600);
  } else {
    input.classList.add('wrong');
    qMsg.textContent = '❌ Неправильно. Попробуй ещё раз.';
    setTimeout(() => input.classList.remove('wrong'), 500);
    input.value = '';
    input.focus();
  }
}

function renderWin() {
  titleEl.textContent = '';
  tilesEl.innerHTML = `
    <div class="win">
      <div class="emoji">🏆</div>
      <h2>Квест пройден! Запомни слово и его форму: интерактивный</h2>
      <div class="found">Режиссёр мультимедиа</div>
      <p>Ты успел, оставалось ${timeLeft} секунд.<br> </p>
      <button onclick="resetGame()">🔄 Пройти заново</button>
    </div>`;
  backBtn.disabled = true;
}

function renderTrap() {
  titleEl.textContent = '';
  tilesEl.innerHTML = `
    <div class="win">
      <div class="emoji">🤔</div>
      <h2>Тупик</h2>
      <div class="trap-msg">Ты нашёл режиссуру мультимедиа... Но ту ли?</div>
      <p>Это не та плашка, а таймер продолжает идти.</p>
      <button onclick="continueQuest()">← Вернуться к выбору</button>
      <button onclick="resetGame()">🔄 Пройти заново</button>
    </div>`;
  backBtn.disabled = true;
}

function continueQuest() {
  trapped = false;
  render();
}

// ——— Таймер ———
function updateTimer() {
  timerEl.textContent = timeLeft;
  timerEl.classList.toggle('low', timeLeft <= 3);
}

function startTimer() {
  timeLeft = TIME_LIMIT;
  updateTimer();
  timerId = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) {
      stopTimer();
      showTimeout();
    }
  }, 1000);
}

function stopTimer() {
  if (timerId) { clearInterval(timerId); timerId = null; }
}

function showTimeout() {
  timeoutOverlay.classList.remove('hidden');
}

// ——— Поток игры ———
function resetGame() {
  stopTimer();
  history = ['institutes'];
  finished = false;
  trapped = false;
  awaitingAnswer = false;
  timerEl.classList.add('hidden');
  timeoutOverlay.classList.add('hidden');
  startOverlay.classList.remove('hidden');
  render();
}

function startGame() {
  startOverlay.classList.add('hidden');
  timerEl.classList.remove('hidden');
  render();
  startTimer();
}

backBtn.addEventListener('click', () => {
  if (history.length > 1) history.pop();
  render();
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', resetGame);

resetGame();
</script>
</body>
